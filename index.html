<!DOCTYPE html>
<html lang="en">

<head>  
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Delicious Apples</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Main White Card -->
    <div class="main-container">

        <!-- Apple Image Card -->
        <div class="image-card">

            <!-- Top Icons -->
            <div class="icons">
                <span>↗</span>
                <span>♡</span>
            </div>


            <!-- Radio Buttons -->
            <input type="radio" name="apple" id="full" checked>
            <input type="radio" name="apple" id="half">
            <input type="radio" name="apple" id="both">


            <!-- Main Apple Images -->
            <div class="main-image">

                <img class="full-img"
                     src="Asstes/full.webp"
                     alt="Full Apple">

                <img class="half-img"
                     src="Asstes/Half_apple.png"
                     alt="Half Apple">

                <img class="both-img"
                     src="Asstes/Green-Apple.png"
                     alt="Green Apples">

            </div>


            <!-- Small Apple Images -->
            <div class="thumbnails">

                <label for="full">
                    <img src="Asstes/full.webp" alt="Full Apple">
                </label>

                <label for="half">
                    <img src="Asstes/Half_apple.png" alt="Half Apple">
                </label>

                <label for="both">
                    <img src="Asstes/Green-Apple.png" alt="Green Apples">
                </label>

            </div>

        </div>


        <!-- Product Information -->
        <div class="product-details">

            <h1>Delicious Apples</h1>

            <p class="code">
                COD: 45999
            </p>


            <!-- Price -->
            <div class="price">
                <span>R$</span> 7.93
                <small>/ kg</small>
            </div>


            <!-- Color -->
            <p class="label">
                SELECT A COLOR
            </p>

            <div class="colors">

                <span class="green"></span>

                <span class="yellow"></span>

                <span class="red"></span>

            </div>


            <!-- Benefits -->
            <p class="label">
                BENEFITS
            </p>

            <ul>
                <li>Apples are nutritious</li>
                <li>Apples may be good for weight loss</li>
                <li>Apples may be good for bone health</li>
                <li>They're linked to a lower risk of diabetes</li>
            </ul>


            <!-- Button -->
            <button>
                ADD TO CART
            </button>

        </div>

    </div>


    <!-- Footer -->
    <p class="footer">
        Design from <u>dribbble shot</u> of
        <u>Rodrigo Ramos</u>
    </p>

</body>

</html>
