<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delicious Apples</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="main-container">
        <section class="image-card" id="imageCardBg" aria-label="Apple images">
            <div class="card-header">
                <button class="icon-button" type="button" aria-label="Share product">↗</button>
                <button class="icon-button" type="button" aria-label="Add to favourites">♡</button>
            </div>
            <div class="main-img-container">
                <input id="full-apple" name="apple-view" type="radio">
                <input id="half-apple" name="apple-view" type="radio">
                <input id="both-apples" name="apple-view" type="radio" checked>
                <img class="main-image full-image" src="Asstes/full.webp" alt="Full green apple">
                <img class="main-image half-image" src="Asstes/Half_apple.png" alt="Half apple">
                <img class="main-image both-image" src="Asstes/Green-Apple.png" alt="Full and half green apples">
            </div>
            <div class="thumbnail-container">
                <label class="thumb" for="full-apple" title="Show full apple"><img src="Asstes/full.webp" alt="Full apple"></label>
                <label class="thumb" for="half-apple" title="Show half apple"><img src="Asstes/Half_apple.png" alt="Half apple"></label>
                <label class="thumb" for="both-apples" title="Show both apples"><img src="Asstes/Green-Apple.png" alt="Full and half apples"></label>
            </div>
        </section>

        <section class="product-details">
            <h1 class="product-title">Delicious Apples</h1>
            <p class="product-code">COD: 45999</p>

            <div class="product-price"><span>R$</span> 7.93 <small>/ kg</small></div>

            <div class="section-label">SELECT A COLOR</div>
            <div class="color-options">
                <button class="color-circle green active" aria-label="Green apple"></button>
                <button class="color-circle yellow" aria-label="Yellow apple"></button>
                <button class="color-circle red" aria-label="Red apple"></button>
            </div>

            <div class="section-label">BENEFITS</div>
            <ul class="benefits-list">
                <li>Apples are nutritious</li>
                <li>Apples may be good for weight loss</li>
                <li>Apples may be good for bone health</li>
                <li>They are linked to a lower risk of diabetes</li>
            </ul>

            <button class="add-to-cart-btn">ADD TO CART</button>
        </section>
    </main>

    <p class="footer-credit">Design from <u>dribbble shot</u> of <u>Rodrigo Ramos</u></p>
</body>
</html>
